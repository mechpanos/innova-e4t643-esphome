# -----------------------------------------------------------------------------
# fancoil.yaml - READ the fan coil into Home Assistant (milestones 1, 2 and 2b)
#
# WHAT IT DOES
#   Listens to the white COMM wire (main board -> touch display) on GPIO34, decodes every
#   frame on the ESP32 (fancoil_decode.h) and publishes:
#     room temperature, last setpoint shown, fan speed, heating and cooling symbols,
#     last mode shown (including "automatic changeover"), what the display shows or that it is off,
#     which of the 8 keys is being touched, bit 29 (meaning unknown),
#     and, EXPERIMENTAL, from the yellow wire: whether the fan is running
#
# WHAT IT DOES NOT DO
#   IT WRITES NOTHING. GPIO34 is input-only; no line is ever driven.
#   It does not know the setpoint unless the display shows it (20 s after a key touch).
#   It does not know the mode while both symbols are off; it keeps the last one shown.
#
# RAW CAPTURE WITHOUT REFLASHING - three ways
#   1. Switch "Raw pulse logging": prints every burst of the WHITE wire like ESPHome's "dump: raw"
#      ("Received Raw: ..."), which is what the tools in ../tools read:
#          timeout 600 esphome logs fancoil.yaml --device <ip> > capture.log
#      A key with an UNKNOWN tail is always logged raw, even with the switch off.
#   2. Switch "Raw yellow logging": the same for the YELLOW wire, with the tag remote.yellow.
#      Do not turn both switches on over a slow link: the log stream may not carry both.
#   3. Button "Record to memory (up to 30 s)": both wires into RAM with millisecond timestamps, printed
#      afterwards (tag "rec"). Keep `esphome logs` running BEFORE you press it. Read with ../tools/rec.py.
#
# THE YELLOW WIRE IS OPTIONAL
#   It carries no key information (see ../docs/PROTOCOL.md section 10); its only use here is the experimental
#   "Fan running" guess. If you did not connect it, delete the `rx_yellow` receiver, the "Raw yellow logging"
#   switch, the "Yellow bursts per second" and "Yellow activity" sensors, the "Fan running (experimental)"
#   binary sensor, and the lines marked YELLOW in the two `interval` blocks.
#
# BEFORE CHANGING THE DECODER
#       python3 ../tools/test_decoder.py ../captures/*.log.gz
#
# WIRING: see ../docs/HARDWARE.md. The line is 5 V logic - never connect it straight to a GPIO.
# -----------------------------------------------------------------------------

substitutions:
  name: fancoil
  friendly_name: Fan coil
  pin_white: GPIO34
  pin_yellow: GPIO35          # optional, through its own series resistor - see ../docs/HARDWARE.md

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - fancoil_decode.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(ts_key).publish_state("none");
          id(ts_mode).publish_state("unknown");
          id(bs_line).publish_state(false);
          id(ts_rec).publish_state("idle");

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"

captive_portal:

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  port: 80
  version: 3
  local: true

# -- THE LINE -----------------------------------------------------------------
# These receiver settings are the ones every capture in ../captures was taken with.
remote_receiver:
  - id: rx_white
    pin: ${pin_white}
    filter: 2us
    idle: 300us
    buffer_size: 20kb
    tolerance: 20%
    on_raw:
      then:
        - lambda: |-
            // ESPHome appends one "idle" element that "Received Raw" does not print.
            // Drop it, so the decoder sees exactly what the captures contain.
            if (x.size() < 2) return;
            const size_t n = x.size() - 1;
            auto &t = fancoil::tracker();
            t.feed(x.data(), n, millis());
            fancoil::recorder().add(1, x.data(), n);

            if (id(raw_dump).state || t.key == fancoil::KEY_UNKNOWN) fancoil::log_raw(x.data(), n);

            if (t.img_changed) {
              char h[24];
              fancoil::hex_of(t.img, h);
              ESP_LOGD("fancoil", "image %s", h);
            }
            if (t.room_changed) id(s_room).publish_state(t.room);
            if (t.setpoint_changed) id(s_setpoint).publish_state(t.setpoint);
            if (t.speed_changed) id(ts_speed).publish_state(fancoil::speed_name(t.speed));
            if (t.screen_changed) id(ts_screen).publish_state(t.screen_setpoint ? "setpoint" : "room temperature");
            if (t.power_changed) {
              id(bs_power).publish_state(!t.display_off);
              if (t.display_off) id(ts_screen).publish_state("off");
              ESP_LOGI("fancoil", "display %s", t.display_off ? "OFF" : "on");
            }
            if (t.bit29_changed) id(ts_bit29).publish_state(t.bit29 ? "1" : "0");
            if (t.heat.changed) id(ts_heat).publish_state(fancoil::sym_name(t.heat.pub));
            if (t.cool.changed) id(ts_cool).publish_state(fancoil::sym_name(t.cool.pub));
            if (t.mode_changed) id(ts_mode).publish_state(fancoil::mode_name(t.mode));
            if (t.key_changed) {
              if (t.key == fancoil::KEY_UNKNOWN) {
                char k[40] = "unknown ";
                size_t p = strlen(k);
                for (int i = 0; i < 16; i++) k[p + i] = (t.key_code >> (15 - i)) & 1 ? '1' : '0';
                k[p + 16] = 0;
                id(ts_key).publish_state(k);
                ESP_LOGW("fancoil", "key with an unknown tail: %s", k);
              } else {
                id(ts_key).publish_state(fancoil::key_name(t.key));
                ESP_LOGI("fancoil", "key: %s", fancoil::key_name(t.key));
              }
            }
            t.clear_changes();

  # -- THE YELLOW WIRE -- capture only. GPIO35 is input-only as well. filter 1us, as in the captures.
  - id: rx_yellow
    pin: ${pin_yellow}
    filter: 1us
    idle: 300us
    buffer_size: 20kb
    tolerance: 20%
    on_raw:
      then:
        - lambda: |-
            if (x.size() < 2) return;
            fancoil::yellow_bursts()++;
            { uint32_t us = 0; for (size_t i = 0; i + 1 < x.size(); i++) us += x[i] < 0 ? -x[i] : x[i]; fancoil::yellow_us() += us; }
            fancoil::recorder().add(2, x.data(), x.size() - 1);
            if (id(raw_dump_yellow).state) fancoil::log_raw_tag("remote.yellow", x.data(), x.size() - 1);

interval:
  # print a memory recording, a little at a time: about 7 kB/s
  - interval: 100ms
    then:
      - lambda: |-
          auto &r = fancoil::recorder();
          r.dump_some(500);
          if (r.state_changed) { r.state_changed = false; id(ts_rec).publish_state(r.state); }
  # is the line alive?
  - interval: 1s
    then:
      - lambda: |-
          auto &t = fancoil::tracker();
          bool alive = t.any_frame && (millis() - t.last_frame_ms) < 2000;
          if (!id(bs_line).has_state() || id(bs_line).state != alive) id(bs_line).publish_state(alive);
          // YELLOW, EXPERIMENTAL: is the fan running? from the activity of the yellow wire during the last second
          static uint64_t u0 = 0; static uint32_t m0 = 0;
          uint32_t now = millis(); uint64_t u = fancoil::yellow_us();
          if (m0 && now - m0 >= 500) {
            auto &g = fancoil::fan_guess();
            g.second((uint32_t) ((u - u0) * 1000 / (now - m0)));
            if (g.changed) { g.changed = false; id(bs_fan).publish_state(g.on); }
          }
          u0 = u; m0 = now;
  # counters and the last image, once a minute so the history stays small
  - interval: 60s
    then:
      - lambda: |-
          static uint32_t f0 = 0, r0 = 0, b0 = 0, o0 = 0, y0 = 0;
          static uint64_t yu0 = 0;
          id(s_yellow).publish_state((fancoil::yellow_bursts() - y0) / 60.0f);   // YELLOW: mean over the last minute
          y0 = fancoil::yellow_bursts();
          id(s_yellow_ms).publish_state((fancoil::yellow_us() - yu0) / 60000.0f);   // YELLOW: ms of activity per second, mean of the minute
          yu0 = fancoil::yellow_us();
          static uint64_t last_img = ~0ULL;
          auto &t = fancoil::tracker();
          id(s_fps).publish_state((t.frames - f0) / 60.0f);
          id(s_rejected).publish_state(t.rejected - r0);
          id(s_odd).publish_state((t.bad_digits - b0) + (t.odd_bits - o0));
          f0 = t.frames; r0 = t.rejected; b0 = t.bad_digits; o0 = t.odd_bits;
          if (t.img_valid && t.img != last_img) {
            char h[24];
            fancoil::hex_of(t.img, h);
            id(ts_hex).publish_state(h);
            last_img = t.img;
          }

sensor:
  - platform: template
    id: s_room
    name: "Room temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: s_setpoint
    name: "Setpoint (last shown)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: s_fps
    name: "Frames per second"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: s_rejected
    name: "Unparsed bursts per minute"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: s_odd
    name: "Images with unexpected bits or digits per minute"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: s_yellow
    name: "Yellow bursts per second"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: s_yellow_ms
    name: "Yellow activity (ms per second)"
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

text_sensor:
  - platform: template
    id: ts_speed
    name: "Fan speed"
    icon: mdi:fan
    update_interval: never
  - platform: template
    id: ts_heat
    name: "Heating symbol"
    icon: mdi:fire
    update_interval: never
  - platform: template
    id: ts_cool
    name: "Cooling symbol"
    icon: mdi:snowflake
    update_interval: never
  - platform: template
    id: ts_mode
    name: "Mode (last shown)"
    icon: mdi:sun-snowflake-variant
    update_interval: never
  - platform: template
    id: ts_screen
    name: "Display shows"
    icon: mdi:numeric
    update_interval: never
  - platform: template
    id: ts_key
    name: "Key"
    icon: mdi:gesture-tap
    update_interval: never
  - platform: template
    id: ts_rec
    name: "Memory recording"
    icon: mdi:record-circle-outline
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: ts_hex
    name: "Last image (hex)"
    entity_category: diagnostic
    update_interval: never
  # Goes to 1 when the unit is switched on with the on/off key and back to 0 at the first setpoint change.
  # What it shows on the display is not known.
  - platform: template
    id: ts_bit29
    name: "Bit 29 (unknown indication)"
    entity_category: diagnostic
    update_interval: never

binary_sensor:
  - platform: template
    id: bs_line
    name: "COMM line"
    device_class: connectivity
    entity_category: diagnostic
  # On or off with the on/off key - from whether the frames arrive whole or split in two.
  - platform: template
    id: bs_power
    name: "Unit on"
    device_class: power
  # EXPERIMENTAL. From the yellow wire (../docs/PROTOCOL.md section 10): more than 100 ms of activity per second = running.
  - platform: template
    id: bs_fan
    name: "Fan running (experimental)"
    device_class: running

button:
  # Records up to 30 s of both wires into memory (or until it is full), then prints it to the log (tag "rec").
  # A second press while recording = stop now and print. The state is shown in "Memory recording".
  - platform: template
    name: "Record to memory (up to 30 s)"
    icon: mdi:record-circle
    entity_category: config
    on_press:
      - lambda: fancoil::recorder().toggle(30000);

switch:
  - platform: template
    id: raw_dump
    name: "Raw pulse logging"
    icon: mdi:waveform
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: raw_dump_yellow
    name: "Raw yellow logging"
    icon: mdi:waveform
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
